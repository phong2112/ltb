services:
  - type: web
    name: hr-copilot-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "4000"
      - key: WEB_ORIGIN
        sync: false
      - key: WEB_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: JWT_ACCESS_TOKEN_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_TTL_SECONDS
        value: "28800"
      - key: JWT_REFRESH_TOKEN_SECRET
        generateValue: true
      - key: JWT_REFRESH_TOKEN_TTL_SECONDS
        value: "2592000"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: "none"
      - key: CV_STORAGE_DRIVER
        value: "r2"
      - key: CV_ARCHIVE_STORAGE_DRIVER
        value: ""
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: UPLOAD_DIR
        value: "/app/uploads"
      - key: MAX_CV_FILE_SIZE_MB
        value: "10"
      - key: AI_PROVIDER
        value: "groq"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      - key: GROQ_MODEL_CHAIN
        value: "llama-3.3-70b-versatile,openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.6-27b,llama-3.1-8b-instant"
      - key: GROQ_MATCH_MODEL_CHAIN
        value: "llama-3.3-70b-versatile,openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.6-27b,llama-3.1-8b-instant"
      - key: GROQ_EXTRACTION_MODEL_CHAIN
        value: "llama-3.1-8b-instant,openai/gpt-oss-20b,qwen/qwen3.6-27b,llama-3.3-70b-versatile"
      - key: GROQ_SUMMARY_MODEL_CHAIN
        value: "llama-3.1-8b-instant,openai/gpt-oss-20b,qwen/qwen3.6-27b,llama-3.3-70b-versatile"
      - key: GROQ_TIMEOUT_MS
        value: "120000"
      - key: PREVIEW_AI_PROVIDER
        value: "gemini"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: GEMINI_BASE_URL
        value: "https://generativelanguage.googleapis.com/v1beta"
      - key: GEMINI_TIMEOUT_MS
        value: "20000"
      - key: AI_JOB_ATTEMPTS
        value: "2"
      - key: CV_EXTRACTION_CONCURRENCY
        value: "1"
      - key: AI_MATCH_CONCURRENCY
        value: "1"
      - key: OCR_MAX_PAGES
        value: "10"
      - key: OCR_MIN_CONFIDENCE
        value: "55"
      - key: OCR_TIMEOUT_MS
        value: "120000"
      - key: APPLICATION_RATE_LIMIT_MAX
        value: "5"
      - key: APPLICATION_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: EMAIL_PROVIDER
        value: "gmail"
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
