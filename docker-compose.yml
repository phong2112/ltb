services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      NODE_OPTIONS: --dns-result-order=ipv4first
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hr_copilot?schema=public
      REDIS_URL: redis://redis:6379
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_TIMEOUT_MS: ${GROQ_TIMEOUT_MS:-120000}
      PREVIEW_AI_PROVIDER: ${PREVIEW_AI_PROVIDER:-disabled}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-20000}
      AI_JOB_ATTEMPTS: ${AI_JOB_ATTEMPTS:-2}
      CV_EXTRACTION_CONCURRENCY: ${CV_EXTRACTION_CONCURRENCY:-1}
      AI_MATCH_CONCURRENCY: ${AI_MATCH_CONCURRENCY:-1}
      POOL_EXTRACTION_CONCURRENCY: ${POOL_EXTRACTION_CONCURRENCY:-2}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-10}
      OCR_MIN_CONFIDENCE: ${OCR_MIN_CONFIDENCE:-55}
      OCR_TIMEOUT_MS: ${OCR_TIMEOUT_MS:-120000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-v.bichlt6@vinsmartfuture.tech}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-demo123}
      ADMIN_NAME: ${ADMIN_NAME:-Lường Bích}
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET:-dev-only-change-me-at-least-32-characters}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-28800}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET:-dev-only-refresh-change-me-at-least-32-characters}
      JWT_REFRESH_TOKEN_TTL_SECONDS: ${JWT_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      CV_STORAGE_DRIVER: ${CV_STORAGE_DRIVER:-r2}
      CV_ARCHIVE_STORAGE_DRIVER: ${CV_ARCHIVE_STORAGE_DRIVER:-vercel-blob}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      SOURCING_DISCOVERY_ENABLED: ${SOURCING_DISCOVERY_ENABLED:-false}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SOURCING_DISCOVERY_MAX_QUERIES_PER_CAMPAIGN: ${SOURCING_DISCOVERY_MAX_QUERIES_PER_CAMPAIGN:-12}
      SOURCING_DISCOVERY_RESULTS_PER_QUERY: ${SOURCING_DISCOVERY_RESULTS_PER_QUERY:-10}
      S3_API: ${S3_API:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      s3_ACCESS_KEY: ${s3_ACCESS_KEY:-}
      s3_BUCKET: ${s3_BUCKET:-}
      s3_BUCKET_NAME: ${s3_BUCKET_NAME:-}
      s3_SECRET_ACCESS_KEY: ${s3_SECRET_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      s3_SECRET_KEY: ${s3_SECRET_KEY:-}
      CLOUD_FLARE_STORAGE_ACCOUNT_ID: ${CLOUD_FLARE_STORAGE_ACCOUNT_ID:-}
      CLOUDFLARE_R2_ACCOUNT_ID: ${CLOUDFLARE_R2_ACCOUNT_ID:-}
      BLOB_STORE_ID: ${BLOB_STORE_ID:-}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      UPLOAD_DIR: /app/uploads
      MAX_CV_FILE_SIZE_MB: 10
      APPLICATION_RATE_LIMIT_MAX: ${APPLICATION_RATE_LIMIT_MAX:-5}
      APPLICATION_RATE_LIMIT_WINDOW_SECONDS: ${APPLICATION_RATE_LIMIT_WINDOW_SECONDS:-60}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-gmail}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
    ports:
      - "4000:4000"
    volumes:
      - cv_uploads:/app/uploads

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hr_copilot
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hr_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  cv_uploads:
