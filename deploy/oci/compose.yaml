services:
  api:
    image: hr-copilot-api:latest
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ${OCI_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: "4000"
      TRUST_PROXY_HOPS: "1"
      UPLOAD_DIR: /app/uploads
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/health').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    tmpfs:
      - /app/uploads
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in deploy/oci/.env}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
